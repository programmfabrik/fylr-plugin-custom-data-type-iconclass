# Build configuration for fylr-build-plugin — the explicit build description.
# Delivered files are listed here; "check" (runs with every build) warns when
# a manifest reference is missing from the build folder.
# All features: https://github.com/programmfabrik/fylr-build-plugin
#
# customDataTypeIconclass.zip is the name this plugin has always published. fylr updates a
# url plugin by re-fetching the url it stored at install time, so that name is
# kept as an alias beside the repository-named asset — without it every
# existing installation would stop updating, silently.

server:
  install:
  - l10n/customDataTypeIconclass.csv
webfrontend:
  coffee1:
  - webfrontend/CustomDataTypeIconclass.coffee
  - webfrontend/CustomDataTypeIconclassTreeview.coffee
  - webfrontend/CustomDataTypeIconclassFacet.coffee
  - webfrontend/iconclassUtilities.coffee
  install:
  - webfrontend/customDataTypeIconclass.css
build:
  bundles:
  - out: updater/iconclassUpdater.js
    sources:
    - src/updater/iconclassUpdater.js
    - webfrontend/iconclassUtilities.coffee
  zip_aliases:
  - customDataTypeIconclass.zip
