plugin:
  name: custom-data-type-iconclass
  version: 1
  url: https://github.com/programmfabrik/fylr-custom-data-type-iconclass
  displayname:
    de-DE: Iconclass-Verknüpfung
    en-US: Iconclass-Referencing
  info:
    de-DE: |
      Ergänzt fylr um einen Feldtyp, mit dem sich Datensätze mit [Iconclass](http://iconclass.org/) verknüpfen lassen – dem etablierten Klassifikationssystem für die Ikonografie von Kunst und Bildern. Redakteure durchsuchen Iconclass-Notationen und Schlagwörter direkt im Maskenfeld und speichern einen Verweis auf das gewählte Konzept. Ein optionaler nächtlicher Updater hält verknüpfte Einträge aktuell.
    en-US: |
      Adds a custom data type for linking records to [Iconclass](http://iconclass.org/), the standard classification system for the iconography of art and images. Editors search Iconclass notations and subject terms from a mask field and store a link to the selected concept. An optional nightly updater keeps linked entries in sync.
  server:
    api-version:
      require: 1
  l10n: l10n/customDataTypeIconclass.csv
  webfrontend:
    url: customDataTypeIconclass.js
    css: customDataTypeIconclass.css
    dependencies:
      - commons-library


base_url_prefix: "webfrontend"
custom_types:
  iconclass:
    mapping:
      conceptName:
        type: text
      conceptURI:
        type: text
        skipTerms: true
      conceptAncestors:
        type: text
        skipTerms: true
      facetTerm:
        type: text_l10n
        skipTerms: true
    config:
      mask:
        - name: editor_display
          parameters:
            value:
              type: select
              options: ["default", "condensed"]
    update:
      plugin_user:
        reference: system:root
      exec:
        service: "node"
        commands:
          - prog: "node"
            stdin:
              type: body
            stdout:
              type: body
            args:
              - type: "value"
                value: "%_exec.pluginDir%/updater/iconclassUpdater.js"
              - type: "value"
                value: "%info.json%"
      timeout: 60
      batch_size: 1
      expires_days: 1


base_config:
  - name: update_iconclass
    group: update_custom_data_type
    parameters:
      restrict_time:
        type: bool
        default: false
        position: 0
      from_time:
        type: int
        default: 19
        min: 0
        max: 24
        position: 1
      to_time:
        type: int
        default: 4
        min: 0
        max: 24
        position: 2
      default_language:
        type: text
        default: 'de'
        position: 3
      custom_expires_days:
        type: int
        min: 1
        default: 1
        position: 4
